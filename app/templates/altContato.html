{% load django_bootstrap5 %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alteração de Contato</title>
    {% bootstrap_css %}
</head>
<body>
    
    <div class="container">
        <h1 class="alter alter-info">Alteração de Contato</h1>

        <form action="{% url 'altContato' cont.id %}" method="post" class="form">
            {% csrf_token%}
            {% bootstrap_form form %}
            <button type="submit" class="btn btn-primary">Alterar Contato</button>
        </form>
    </div>
    {% bootstrap_javascript %}
</body>
</html>
